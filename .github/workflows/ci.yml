name: CI

on: [push, pull_request]

env:
  CARGO_TERM_COLOR: always
  # Warning-zero policy: any rustc warning in this repo is a regression.
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # models/unitree_go2 (go2.misa)
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cyclonedds-sys ships committed bindings + a vendored libddsc,
      # so a plain check needs no system DDS / libclang.
      - name: Check (all targets, all features)
        run: cargo check --all-targets --all-features
      # Unit tests over the pure logic (transient profile, joint
      # mapping, CLI, Phase A / A2 helpers against the real go2.misa).
      - name: Test
        run: cargo test

  # Coverage via cargo-llvm-cov; uploaded to Codecov over OIDC.
  coverage:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Measure coverage
        run: cargo llvm-cov --lcov --output-path lcov.info
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          use_oidc: true
